version: '3.8'

services:

  # note; symlink docker-compose.development.yml to
  # docker-compose.override.yml when developing.

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    command: >
      redis-server 
        --save 60 1
        --dir /data
        --dbfilename dump.rdb
        --maxmemory 512mb 
        --maxmemory-policy allkeys-lru
    networks:
      - idms_web_network
    ports:
      - "6379:6379"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - redis_data:/data

  idms_web:
    build:
      context: .
      args:
        BRANCH: ${BRANCH:-master}
    #image: gitlab.rivm.nl:4567/bioinformatics/idms_web:latest
    environment:
      FLASK_APP: 'idms.web:create_app()'
      FLASK_INSTANCE_PATH: /idms_web/instance
      PORT: 3456
    depends_on:
      - redis
    ports:
      - 3333:3456
    volumes:
      - ./instance/:/idms_web/instance/:ro
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
        tag: "idmsweb-docker"
        syslog-facility: "local6"
    networks:
      - idms_web_network

networks:
  idms_web_network:
    driver: bridge

volumes:
  redis_data:
    driver: local