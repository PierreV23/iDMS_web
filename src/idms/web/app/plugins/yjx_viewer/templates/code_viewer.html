<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            margin: 0; 
            padding: 16px; 
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; 
            font-size: 13px;
            background-color: #272822; 
            color: #f8f8f2; 
        }
        .highlight { background: transparent; overflow-x: auto; }
        .highlight pre { margin: 0; font-family: inherit; }
        .error-banner { 
            background-color: #751a1a; color: #f8f8f2; border: 1px solid #e74c3c;
            padding: 10px 14px; margin-bottom: 14px; border-radius: 4px; 
            font-family: sans-serif; font-size: 13px;
        }
        .lineno { color: #75715e; padding-right: 12px; user-select: none; }
        {{ css|safe }}
    </style>
</head>
<body>
    {% if parse_error %}
        <div class="error-banner">
            <strong>Syntax Error:</strong> {{ parse_error }}
        </div>
    {% endif %}
    {{ code_html|safe }}
</body>
</html>
