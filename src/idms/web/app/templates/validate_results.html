<table class="table table-sm table-striped table-bordered">
    <thead>
        <tr>
            {% for column in data %}
            <th>{{ column }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
    {% for item in data['Description'] %}
        <tr>
            {% for column in data %}
            <td>{% if data[column][item] %}{{ data[column][item] }}{% endif %}</td>
            {% endfor %}
        </tr>

    {% endfor %}
    </tbody>
</table>
