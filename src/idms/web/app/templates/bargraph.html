<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="xcontainer" style="max-width: 800px;">
    <div class="card shadow-sm border-0 p-4">
        <div class="card-body">
            <h2 class="card-title h3 fw-bold text-dark mb-1" id="graph-title">Please wait ...</h2>
            <!-- Container for the chart to control height -->
            <div style="position: relative; height: 400px; width: 100%; overflow: hidden">
                <canvas id="myBarChart" style="display: block;"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // Fetch data from our Flask REST endpoint
    fetch('{{ data_url | safe }}')
        .then(response => response.json())
        .then(data => {
            const ctx = document.getElementById('myBarChart').getContext('2d');

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: data.name,
                        data: data.values,
                        backgroundColor: 'rgba(59, 130, 246, 0.6)', // Nice Tailwind blue
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
            $('#graph-title').html(data.title)
        })
        .catch(error => console.error('Error fetching data:', error));
</script>
