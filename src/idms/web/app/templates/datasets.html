{% extends 'base2.html' %}

  
{% block header %}
<h2>{% block title %}Datasets{% endblock %}</h2>
{% endblock %}

{% block content %}
<h2>Dataset List</h2>
<table class="table table-striped table-hover table-sm">
<tr>
<th>Project</th>
<th>Dataset name</th>
</tr>
{% for entry in datasets %}
   <td>{{ entry.projectID}}
   </td>
   <td>
   <a href="/collbrowser?path={{ entry.name }}">
   {{ entry.name }}
   </a>
   </td>
</tr>
{% endfor %}
 </table>
{% endblock %}
