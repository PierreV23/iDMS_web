stages:
  - test
  - build
  - internal_publish
  - release_publish
  - deploy

variables:
  # Moved ASSETS_TOKEN to GitLab Masked CI/CD Variables
  ASSETS_REPO_URL: "https://oauth2:${ASSETS_TOKEN}@gitlab.rivm.nl/bioinformatics/ngsweb_rivm_assets.git"
  #ASSETS_REPO_URL: git@gitlab.rivm.nl:bioinformatics/ngsweb_rivm_assets.git
  PYPI_INDEX_URL: "${CI_API_V4_URL}/projects/4682/packages/pypi/simple"
  INSTANCE_BRANDING_DIR: "/opt/idms_web/instance/branding"

include:
  # Unit testing
  #- component: $CI_SERVER_FQDN/bioinformatics/pipelines/python/unittesting@0.2.1
  #  inputs:
  #    stage: test
  # Build and publish the package
  - component: $CI_SERVER_FQDN/bioinformatics/pipelines/python/build_package@0.2.1
    inputs:
      job_name: build_package
      stage: build
  #    rules:
  #      - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
  # Publish RC internally
  - component: $CI_SERVER_FQDN/bioinformatics/pipelines/python/publish_package@0.2.1
    inputs:
      job_name: publish_package_rc
      stage: internal_publish
  #    rules:
  #      - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  # Build and release package
  - component: $CI_SERVER_FQDN/bioinformatics/pipelines/python/publish_package@0.2.1
    inputs:
      job_name: publish_package_pr
      username: oauth2
      password: $PUBLISH_TOKEN
      publish_url: ${CI_API_V4_URL}/projects/4682/packages/pypi
      stage: release_publish
  #    rules:
  #      - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Override rules on the jobs created by the components
build_package:
  before_script:
    - export PATH="$HOME/.local/bin:$PATH"
    - test -f $HOME/.local/bin/env && source $HOME/.local/bin/env || true
  tags:
    - prod
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/

publish_package_rc:
  before_script:
    #- export PATH="$HOME/.local/bin:$PATH"
    - test -f $HOME/.local/bin/env && source $HOME/.local/bin/env || true
  tags:
    - prod
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

publish_package_pr:
  before_script:
    - export PATH="$HOME/.local/bin:$PATH"
    - test -f $HOME/.local/bin/env && source $HOME/.local/bin/env || true
  tags:
    - prod
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
